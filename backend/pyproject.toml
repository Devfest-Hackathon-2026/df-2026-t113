[project]
name = "yasashii-backend"
version = "0.1.0"
description = "Local sample-notice API for the Yasashii mobile demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[dependency-groups]
dev = ["black>=24,<27", "flake8>=7,<8", "pytest>=8,<10", "httpx>=0.27,<1"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
